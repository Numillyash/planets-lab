name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate finite-fuel Tow discovery tooling
        run: |
          bash -n tools/run-finite-fuel-tow-historical-gate.sh
          bash -n tools/run-finite-fuel-tow-warp-well-gate.sh
          bash -n tools/run-finite-fuel-tow-external-context-gate.sh
          bash -n tools/run-finite-fuel-tow-residual-shape-gate.sh
          bash -n tools/run-finite-fuel-tow-storm-vector-gate.sh
          bash -n tools/run-finite-fuel-tow-transient-storm-state-gate.sh
          bash -n tools/run-finite-fuel-tow-classic-storm-membership-gate.sh
          bash -n tools/run-finite-fuel-tow-storm-mode-resolution-gate.sh
          bash -n tools/run-finite-fuel-tow-classic-storm-reclassification-gate.sh
          bash -n tools/run-finite-fuel-tow-classic-multiroot-gate.sh
          bash -n tools/run-finite-fuel-tow-passenger-chunnel-context-gate.sh
          bash -n tools/run-finite-fuel-tow-passenger-chunnel-resolution-gate.sh
          bash -n tools/run-finite-fuel-tow-break-independent-movement-gate.sh
          bash -n tools/run-finite-fuel-tow-same-line-reconciliation-gate.sh
          bash -n tools/run-finite-fuel-tow-same-line-stop-context-gate.sh
          bash -n tools/run-finite-fuel-tow-same-line-context-resolution-gate.sh
          bash -n tools/run-finite-fuel-tow-documented-reconciliation-gate.sh
          python tools/diagnostics/tow_finite_fuel_population_audit.py --help >/dev/null
          python tools/diagnostics/tow_finite_fuel_warp_well_audit.py --help >/dev/null
          python tools/diagnostics/tow_finite_fuel_external_context_audit.py --help >/dev/null
          python tools/diagnostics/tow_finite_fuel_residual_shape_audit.py --help >/dev/null
          python tools/diagnostics/tow_finite_fuel_storm_vector_audit.py --help >/dev/null
          python tools/diagnostics/tow_finite_fuel_transient_storm_state_audit.py --help >/dev/null
          python tools/diagnostics/tow_finite_fuel_classic_storm_membership_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_storm_mode_resolution_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_classic_storm_reclassification_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_classic_multiroot_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_passenger_chunnel_context_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_passenger_chunnel_resolution_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_break_independent_movement_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_same_line_reconciliation_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_same_line_stop_context_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_same_line_context_resolution_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/tow_finite_fuel_documented_reconciliation_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python -c "from intercept_fuel_historical_differential_audit import PREPARED_DIR, RAW_DIR; assert PREPARED_DIR; assert RAW_DIR"

      - name: Validate corpus feature index tooling
        run: |
          bash -n tools/run-corpus-feature-index-gate.sh
          python -m planets_lab.corpus.feature_index_cli --help >/dev/null
          python tools/diagnostics/corpus_feature_index_integration_check.py --help >/dev/null
          python tools/diagnostics/combat_classic_corpus_parity_audit.py --help >/dev/null
          python tools/diagnostics/combat_planet_chain_audit.py --help >/dev/null
          python tools/diagnostics/combat_ship_chain_phase_audit.py --help >/dev/null
          python tools/diagnostics/combat_ship_chain_cluster_audit.py --help >/dev/null
          python tools/diagnostics/combat_feature_scope_integration_check.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/combat_host_post_mutation_next_pair_audit.py --help >/dev/null
          python tools/diagnostics/combat_predictive_queue_integration_check.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/combat_host_capture_continuation_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/combat_host_post_capture_opponent_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/combat_host_post_capture_initiator_population_audit.py --help >/dev/null
          PYTHONPATH="$PWD/src:$PWD/tools/diagnostics" python tools/diagnostics/combat_host_post_capture_ship_candidate_audit.py --help >/dev/null
          python tools/diagnostics/combat_capture_reintegration_check.py --help >/dev/null
          bash -n tools/run-combat-feature-scope-gate.sh
          bash -n tools/run-combat-predictive-queue-gate.sh
          bash -n tools/run-combat-capture-reintegration-gate.sh
          bash -n tools/run-with-runtime-evidence.sh
          bash -n tools/run-combat-capture-reintegration-with-evidence.sh
          bash -n tools/run-combat-post-capture-candidate-discovery.sh
          bash -n tools/run-combat-post-capture-candidate-with-evidence.sh
          mkdir -p /tmp/feature-index-a /tmp/feature-index-b /tmp/no-loadall /tmp/no-compiled
          python -m planets_lab.corpus.feature_index_cli build \
            --archive-dir /tmp/no-loadall \
            --compiled-dir /tmp/no-compiled \
            --output /tmp/feature-index-a/game_features.parquet \
            --database /tmp/feature-index-a/corpus.duckdb \
            --build-meta /tmp/feature-index-a/build.json >/dev/null
          python -m planets_lab.corpus.feature_index_cli build \
            --archive-dir /tmp/no-loadall \
            --compiled-dir /tmp/no-compiled \
            --output /tmp/feature-index-b/game_features.parquet \
            --database /tmp/feature-index-b/corpus.duckdb \
            --build-meta /tmp/feature-index-b/build.json >/dev/null
          cmp /tmp/feature-index-a/game_features.parquet /tmp/feature-index-b/game_features.parquet
          python -m planets_lab.corpus.feature_index_cli select \
            --index /tmp/feature-index-a/game_features.parquet \
            --profile ordinary-classic \
            --output /tmp/feature-index-a/ordinary-classic.json >/dev/null

      - name: Run tests
        run: pytest
