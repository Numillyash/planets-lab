[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "planets-lab"
version = "0.1.0"
description = "Deterministic Planets.nu simulation and AI research environment"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Numillyash" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
